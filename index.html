<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>McKinsey War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow briefing column, like a dossier read on a phone at a table */
:root{
  --paper:#E9ECE5; --card:#F7F8F3; --ink:#152033; --muted:#596476; --line:#C7CEC3;
  --accent:#B9652A; --good:#2C7653; --bad:#B0372B;
  --r-mck:#1F4C8A; --r-cli:#2C7653; --r-acc:#6E3A93; --r-stp:#B4462F;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1522; --card:#162033; --ink:#E3E7DF; --muted:#9AA4B4; --line:#2B364A;
  --accent:#E3995A; --good:#63BF8E; --bad:#EE7668;
  --r-mck:#78A2E3; --r-cli:#63BF8E; --r-acc:#B98ADA; --r-stp:#E58068; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1522; --card:#162033; --ink:#E3E7DF; --muted:#9AA4B4; --line:#2B364A;
  --accent:#E3995A; --good:#63BF8E; --bad:#EE7668;
  --r-mck:#78A2E3; --r-cli:#63BF8E; --r-acc:#B98ADA; --r-stp:#E58068; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:580px;margin:0 auto;padding-inline:18px;padding-block:22px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(2.2rem,9vw,3.1rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:1.02rem;max-width:34em}
/* War-room hero: a command-centre panel that stays dark in both themes */
.warhero{--wh-bg:#0A111D; --wh-fg:#EEF1EA; --wh-dim:#93A0B4; --wh-grid:rgba(147,160,180,.13); --wh-amber:#F0A24E; --wh-red:#FF5A4A;
  position:relative;overflow:hidden;border-radius:8px;background:var(--wh-bg);color:var(--wh-fg);
  padding:20px 18px 22px;display:flex;flex-direction:column;gap:14px;
  background-image:linear-gradient(var(--wh-grid) 1px,transparent 1px),linear-gradient(90deg,var(--wh-grid) 1px,transparent 1px);
  background-size:28px 28px;box-shadow:inset 0 0 0 1px rgba(240,162,78,.25)}
.warhero>*:not(.wh-scan){position:relative}
.wh-scan{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(240,162,78,.14) 48%,rgba(240,162,78,.0) 52%,transparent 100%);background-size:100% 220%;animation:sweep 6s linear infinite;pointer-events:none}
@keyframes sweep{from{background-position:0 120%}to{background-position:0 -120%}}
.wh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--wh-dim)}
.wh-live{display:inline-flex;align-items:center;gap:8px;color:var(--wh-red)}
.wh-live i{width:8px;height:8px;border-radius:50%;background:var(--wh-red);box-shadow:0 0 0 0 rgba(255,90,74,.6);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,74,.6)}80%,100%{box-shadow:0 0 0 9px rgba(255,90,74,0)}}
.wh-kicker{font-family:var(--mono);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--wh-amber);margin-top:6px}
.warhero h1{font-size:clamp(2.9rem,14vw,5rem);font-weight:800;line-height:.88;letter-spacing:-.035em;text-transform:uppercase;display:flex;flex-direction:column}
.warhero h1 span{color:var(--wh-amber);font-size:1.18em;letter-spacing:-.04em}
.wh-lede{color:var(--wh-dim);font-size:1rem;max-width:34em}
.wh-meta{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(147,160,180,.3);padding-top:12px;gap:8px}
.wh-meta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.wh-meta b{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1;color:var(--wh-fg)}
.wh-meta span{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--wh-dim)}
@media (max-width:380px){.wh-meta{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.wh-scan,.wh-live i{animation:none}}
.disclaimer{display:grid;gap:6px;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--card)}
.disclaimer p{font-size:.82rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.section-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:6px}


.steps{display:grid;gap:14px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted);font-size:.93rem}

.map{display:grid;border-top:1px solid var(--line)}
.map div{display:grid;grid-template-columns:5.6em 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.map .n{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.note{font-size:.88rem;color:var(--muted)}

.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.roles{grid-template-columns:1fr}}
.role{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .15s,border-color .15s}
.role:hover{border-color:var(--rc);transform:translateY(-2px)}
.role:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.tile{width:38px;height:38px;border-radius:4px;background:var(--rc);color:var(--card);font-family:var(--display);font-weight:800;font-size:1.1rem;display:grid;place-items:center}
.role .t{font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.15}
.role .p{font-size:.82rem;font-weight:600;color:var(--rc)}
.role .g{font-size:.85rem;color:var(--muted);line-height:1.35}
.table-no{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}

/* briefing */
.seat{display:grid;gap:0;border-top:1px solid var(--line)}
.seat div{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.seat dt{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seat dd{margin:0;font-size:.95rem}

/* play */
.bar{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;min-width:0}
.chip i{width:12px;height:12px;border-radius:2px;background:var(--rc);display:inline-block;flex:none}
.prog{display:flex;gap:4px}
.prog span{width:18px;height:6px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--rc)}
.meters{display:grid;gap:8px}
.meter{display:grid;grid-template-columns:7.5em 1fr 2.4em;gap:10px;align-items:center;font-size:.85rem}
.meter .lab{color:var(--muted)}
.meter .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter .fill{height:100%;background:var(--rc);border-radius:4px;transition:width .6s ease}
.meter .val{font-family:var(--mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}

.sec{display:inline-flex;align-self:flex-start;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rc);border:1px solid var(--rc);border-radius:3px;padding:3px 8px}
.prompt{display:flex;flex-direction:column;gap:10px}
.prompt h3{font-size:1.3rem}
.prompt p{font-size:1.06rem;line-height:1.5}
.yourcall{font-size:.95rem;border-left:3px solid var(--rc);padding-left:12px}
.yourcall b{color:var(--rc)}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 14px;transition:border-color .15s}
.opt:hover{border-color:var(--rc)}
.opt .k{font-family:var(--mono);font-size:.9rem;width:30px;height:30px;border-radius:4px;border:1.5px solid var(--rc);color:var(--rc);display:grid;place-items:center}
.opt .ol{display:block;font-weight:600;line-height:1.35}
.opt .os{display:block;font-size:.86rem;color:var(--muted);margin-top:3px;line-height:1.4}

.result{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.picked{font-size:.9rem;color:var(--muted)}
.picked b{color:var(--ink)}
.result .what{font-size:1.06rem;line-height:1.55}
.impact{display:grid;gap:10px}
.impact div{display:grid;gap:2px}
.impact .v{font-size:.95rem}
.standing{font-weight:600}
.standing.up{color:var(--good)} .standing.down{color:var(--bad)} .standing.flat{color:var(--ink)}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.delta{font-family:var(--mono);font-size:.78rem;padding:4px 9px;border-radius:3px;border:1px solid currentColor;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}
.lesson{border-top:1px dashed var(--line);padding-top:12px;font-size:.93rem;display:flex;flex-direction:column;gap:4px}

.btn{all:unset;cursor:pointer;text-align:center;font-weight:600;padding:14px 18px;border-radius:6px;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btns{display:grid;gap:10px}

/* ending */
.stamp{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:22px 18px;border:2px solid var(--rc);border-radius:6px;background:var(--card)}
.stamp .badge{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--card);background:var(--rc);padding:4px 9px;border-radius:3px}
.stamp h2{font-size:clamp(1.9rem,8vw,2.5rem);color:var(--rc)}
.meaning{background:var(--ink);color:var(--paper);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.meaning .eyebrow{color:var(--paper);opacity:.75}
.meaning p{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.3}
.recap{display:grid;border-top:1.5px solid var(--ink)}
.recap .row{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
.recap .row .ch{font-weight:600}
.recap .row{gap:8px}
.recap .row .q{font-size:.93rem;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;line-height:1.45}
.recap .row .ls{font-size:.88rem;color:var(--muted)}
.recap .lbl{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rc);font-weight:500;margin-bottom:1px}
.qbox{display:grid;gap:4px;font-size:.93rem;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;line-height:1.45}
.debrief{border:1.5px dashed var(--accent);border-radius:6px;padding:14px 16px;font-size:.95rem;display:grid;gap:4px}
.debrief b{color:var(--accent)}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.anim>*{animation:rise .35s ease both}
@media (prefers-reduced-motion:reduce){.anim>*{animation:none}.meter .fill,.role{transition:none}}
</style>
</head>
<body>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function(){
const SECTIONS = {
  1:"McKinsey today",
  2:"Five forces",
  3:"Path A: strategy advisor",
  4:"Path B: tech firm",
  5:"Trust and reputation",
  6:"Our recommendation"
};

const ROLES = {
  mck:{
    name:"McKinsey", table:1, letter:"M", color:"var(--r-mck)",
    title:"Global Managing Partner",
    goal:"Protect prestige and profit",
    org:"McKinsey & Company",
    answer:"The senior partners who elected you",
    control:"How the firm is staffed, how it charges, what it becomes and which clients it accepts.",
    stake:"The firm's 100-year reputation, partners' pay and the careers of thousands of consultants.",
    situation:"Clients are questioning your fees, the Big Four are selling strategy, and AI can now do much of your junior consultants' work.",
    judge:"the senior partners who elected you",
    metrics:{profit:"Profit", prestige:"Prestige", relevance:"Future-ready"},
    decisions:[
      {sec:1, area:"Your team model",
       prompt:"AI can now do much of the research and slide work your junior consultants do. Today a few partners lead large teams of juniors, and that leverage is how the firm makes money.",
       call:"You decide how the firm is staffed for the next decade.",
       options:[
        {l:"Keep the pyramid: few partners, many juniors", s:"The model that built the firm.", e:{profit:10,prestige:0,relevance:-15},
         r:"Profits stay strong for now. But clients can see that AI could do much of what your juniors bill for, and they start asking for discounts.",
         who:"Partners keep their pay. Clients start questioning bills.",
         lesson:"The leverage model works only while junior work is hard to automate."},
        {l:"Move to a diamond: fewer juniors, more experts plus AI", s:"Smaller, more senior teams.", e:{profit:-5,prestige:5,relevance:15},
         r:"Graduate hiring falls and you invest in experienced specialists and AI tools. Costs rise this year, but each team now delivers faster with fewer people.",
         who:"Graduates get fewer offers. Clients get more senior attention.",
         lesson:"This is the team model our group recommends in Section 6."},
        {l:"Replace most juniors with AI", s:"Cut costs quickly.", e:{profit:15,prestige:-10,relevance:5},
         r:"Margins jump. But you lose the pipeline that trains future partners, and top graduates start to see McKinsey as a weaker place to build a career.",
         who:"Thousands of juniors leave. Your future partner pipeline shrinks.",
         lesson:"Talent is McKinsey's core resource, even when supplier power is weak."},
        {l:"Retrain juniors as AI and data specialists", s:"Keep the people, change the skills.", e:{profit:-10,prestige:5,relevance:10},
         r:"Training is expensive and slows projects for a year, but your consultants can now build AI solutions, not just slides.",
         who:"Juniors keep their jobs with new skills. Partners accept lower pay this year.",
         lesson:"Resource-based view: rebuilding capabilities from within."}
      ]},
      {sec:2, area:"Pricing under pressure",
       prompt:"Buyer power is strong. Many clients now employ ex-consultants, and they say AI makes your work faster, so it should cost less.",
       call:"You set how the firm charges every client.",
       options:[
        {l:"Keep premium hourly rates", s:"Defend the value of your experts.", e:{profit:10,prestige:5,relevance:-15},
         r:"Profits hold this year. But CFOs start sending smaller projects to cheaper firms and AI tools.",
         who:"Partners are protected this year. Smaller clients drift to rivals.",
         lesson:"Buyer power: clients have the knowledge and tools to question fees."},
        {l:"Charge for results delivered", s:"Part of each fee depends on the client's outcome.", e:{profit:5,prestige:5,relevance:15},
         r:"Clients like that you share the risk. Revenue becomes less predictable, and every team now has to prove real impact.",
         who:"Your teams carry more risk. Clients see clearer value.",
         lesson:"This answers the case's ROI problem: clients struggle to see what consulting is worth."},
        {l:"Cut fees by 20%", s:"Keep clients by being cheaper.", e:{profit:-20,prestige:-10,relevance:5},
         r:"Clients stay, but margins shrink and the market reads it as an admission that your work was overpriced.",
         who:"Clients pay less. Partners' bonuses fall.",
         lesson:"Competing on price weakens a premium brand."},
        {l:"Sell a yearly subscription of AI tools plus advisers", s:"Recurring income instead of one-off projects.", e:{profit:5,prestige:0,relevance:10},
         r:"You gain steady, recurring income, like McKinsey Solutions in the case. Margins per project fall and you start to look like a software company.",
         who:"Clients get ongoing support. You start competing with software companies.",
         lesson:"Moving beyond the one-off project model."}
      ]},
      {sec:3, area:"Defending the boardroom",
       prompt:"The Big Four now sell strategy through EY-Parthenon, Strategy& and Monitor Deloitte. They are pitching your biggest CEO clients.",
       call:"You decide how to protect McKinsey's most prestigious work.",
       options:[
        {l:"Focus only on CEO and board-level work", s:"Turn down smaller projects.", e:{profit:-10,prestige:15,relevance:-5},
         r:"Your brand gets sharper and boards still call you first. Revenue falls as you turn down mid-size work your rivals happily take.",
         who:"Partners focus on fewer, bigger clients. Junior work shrinks.",
         lesson:"Path A's strength is prestige. Its weakness is a shrinking market."},
        {l:"Build deep industry expertise in every sector", s:"Hire specialists, not just generalists.", e:{profit:-5,prestige:10,relevance:10},
         r:"Clients now get advisers who know their industry in detail. It costs more to hire, but your advice is harder for rivals to copy.",
         who:"Specialists join from industry. Generalist consultants must adapt.",
         lesson:"Advice that is hard to copy keeps a premium."},
        {l:"Match the Big Four on price", s:"Don't lose clients over fees.", e:{profit:-15,prestige:-10,relevance:0},
         r:"You keep the clients, but boards now compare you with accounting firms on price, and your premium position slips.",
         who:"Clients win on price. Your brand loses its edge.",
         lesson:"Rivalry on price lowers profits for the whole industry."},
        {l:"Use your alumni network to win work", s:"Ex-McKinsey executives now run many client firms.", e:{profit:5,prestige:5,relevance:-5},
         r:"Old relationships bring in projects quickly. But former consultants know exactly what you do, and they push hardest on price and value.",
         who:"Alumni open doors. They also negotiate harder.",
         lesson:"The Big Three have about 50,000 alumni, many now at client firms."}
      ]},
      {sec:4, area:"The tech question",
       prompt:"Classic strategy is now about 10% of the Big Three's revenue. Most growth is in technology and implementation, where Accenture is far bigger.",
       call:"You decide what McKinsey becomes.",
       options:[
        {l:"Become a full AI and tech implementation firm", s:"Build and run systems for clients.", e:{profit:-5,prestige:-15,relevance:15},
         r:"You win large build-and-run contracts, but now compete with Accenture on its home turf, with fewer engineers and thinner margins.",
         who:"Thousands of engineers join. Strategy partners feel sidelined.",
         lesson:"Path B's risk: losing what makes McKinsey different."},
        {l:"Buy AI startups and run them as a separate tech arm", s:"Keep the core brand focused.", e:{profit:-10,prestige:5,relevance:10},
         r:"The core brand stays focused while the tech arm grows, as McKinsey did with QuantumBlack. Integration is slow and costly.",
         who:"Startup founders join the firm. Two cultures must work together.",
         lesson:"Buying capabilities you can't build fast enough."},
        {l:"Stay strategy-led, but use AI to help clients deliver", s:"Expert teams, AI tools, help with implementation.", e:{profit:5,prestige:5,relevance:10},
         r:"Expert teams with AI tools advise and help put plans into action. You keep board access and add staying power.",
         who:"Consultants learn to work alongside AI. Clients get advice that gets implemented.",
         lesson:"The hybrid path our group recommends in Section 6."},
        {l:"Partner with tech firms to do the building", s:"You design, a partner builds.", e:{profit:5,prestige:0,relevance:5},
         r:"You design the strategy and a tech partner builds it. It's quick and cheap, but clients start to wonder why they need two firms.",
         who:"Your tech partner gains access to your clients.",
         lesson:"Partnering is fast, but it hands rivals your relationships."}
      ]},
      {sec:5, area:"A $50M contract",
       prompt:"A government facing corruption allegations offers McKinsey a $50M contract. Your partners are split.",
       call:"You decide what McKinsey's name stands for.",
       options:[
        {l:"Decline and tighten client-screening rules", s:"Lose the money, protect the name.", e:{profit:-10,prestige:15,relevance:0},
         r:"You lose $50M, but clients and recruits notice that you turn work down on principle.",
         who:"Partners lose fees. Recruits and clients see a firm with principles.",
         lesson:"Institution-based view: integrity and legitimacy are core assets."},
        {l:"Take it quietly and keep it confidential", s:"Nobody needs to know.", e:{profit:15,prestige:-40,relevance:0}, flag:"scandal",
         r:"Eighteen months later the contract leaks. Headlines, apologies and lost clients follow, much like McKinsey's South Africa scandal.",
         who:"Every client and employee is asked about it. Senior leaders resign.",
         lesson:"Monitor Group's Libya work contributed to its collapse in 2012."},
        {l:"Take a limited project with an independent ethics review", s:"Narrow scope, public terms.", e:{profit:5,prestige:-5,relevance:0},
         r:"You take a narrower project with public terms and outside review. Critics stay vocal, but nothing is hidden.",
         who:"Critics stay vocal. Clients can defend working with you.",
         lesson:"Managing reputational risk through transparency."},
        {l:"Take it openly. It is legal and profitable", s:"Clients hire you for results, not politics.", e:{profit:15,prestige:-25,relevance:0},
         r:"It's legal, but journalists and activists focus on you. Some clients quietly move their work elsewhere.",
         who:"Clients face questions from their own boards.",
         lesson:"What is legal is not always seen as legitimate."}
      ]}
    ],
    ending(m,f){
      if(f.scandal) return "monitor";
      if(m.relevance<45) return "dinosaur";
      if(m.prestige<40) return "lite";
      if(m.profit<35) return "discount";
      if(m.relevance>=70 && m.prestige>=60) return "advisor";
      return "survivor";
    },

        {l:"Go ahead. It's the client's responsibility", s:"Move fast.", e:{growth:10,cash:10,indep:0}, flag:"scandal",
         r:"Six months later regulators investigate the client and your company is named. Investors and customers pull back.",
         who:"Customers whose data was used complain publicly.",
         lesson:"One scandal can stop a young firm, as it stopped Monitor Group."},
        {l:"Use only anonymised data", s:"Less detail, no privacy risk.", e:{growth:5,cash:0,indep:0},
         r:"The analysis is less detailed, but there is no privacy risk. The client accepts.",
         who:"Customers' identities stay protected.",
         lesson:"Managing risk without losing the deal."},
        {l:"Bring in an independent privacy audit first", s:"Prove you are safe.", e:{growth:0,cash:-5,indep:5},
         r:"It costs time and money, but you can show every client exactly how data is handled.",
         who:"An auditor reviews your systems.",
         lesson:"Transparency builds legitimacy."}
      ]}
    ],
    ending(m,f){
      if(f.scandal) return "fallout";
      if(f.sold) return "acq";
      if(m.cash<35) return "burn";
      if(m.growth>=85) return "disrupt";
      return "niche";
    },
    endings:{
      fallout:{t:"Regulator's Target", s:"Your growth stalled when your name appeared in a privacy investigation. Customers now ask hard questions before signing.", m:"Trust is the hardest barrier for new entrants, and McKinsey's strongest defence."},
      acq:{t:"Acquired", s:"You sold to McKinsey. Your AI now makes their teams faster, and the threat you posed became their tool.", m:"Buying AI capability is one way McKinsey can respond."},
      burn:{t:"Burned Out", s:"You grew fast but ran out of money before the market caught up.", m:"Disruption is hard. That gives McKinsey time, but not forever."},
      disrupt:{t:"The Disruptor", s:"Clients now get research and analysis from you in minutes, at a fraction of the price. Junior consulting work is shrinking.", m:"This is the AI threat to McKinsey's leverage model."},
      niche:{t:"The Niche Player", s:"You built a solid business serving a clear segment. You haven't shaken the giants yet.", m:"Many new entrants nibble at the edges instead of replacing incumbents."}
    }
  }
};

const app = document.getElementById("app");
let S = {};
const LETTERS = ["A","B","C","D"];
const clamp = v => Math.max(0, Math.min(100, v));

function toTop(){ try{ window.scrollTo({top:0, behavior:"instant"}); }catch(e){ window.scrollTo(0,0); } }
function view(html){ app.className = "wrap anim"; app.innerHTML = html; toTop(); }
function secTag(n){ return `<span class="sec">Section ${n} · ${SECTIONS[n]}</span>`; }

function home(){
  const cards = Object.entries(ROLES).map(([id,r]) => `
    <button class="role" style="--rc:${r.color}" data-role="${id}">
      <span class="table-no">Table ${r.table}</span>
      <span class="tile">${r.letter}</span>
      <span class="t">${r.name}</span>
      <span class="p">${r.title}</span>
      <span class="g">${r.goal}</span>
    </button>`).join("");
  const map = [1,2,3,4,5].map(n=>`<div><span class="n">Decision ${n}</span><span>${SECTIONS[n]}</span></div>`).join("");
  view(`
    <header class="warhero">
      <div class="wh-scan" aria-hidden="true"></div>
      <div class="wh-top">
        <span class="wh-live"><i></i>Briefing in session</span>
        <span>MGMT5603</span>
      </div>
      <p class="wh-kicker">Operation · AI Disruption</p>
      <h1>The McKinsey<span>War Room</span></h1>
      <p class="wh-lede">AI is reshaping consulting. Each table takes a leadership seat at one of four organisations and makes five decisions drawn from our presentation. Your choices shape your organisation's future.</p>
      <div class="wh-meta">
        <div><b>4</b><span>Tables</span></div>
        <div><b>5</b><span>Decisions</span></div>
        <div><b>~6</b><span>Minutes</span></div>
        <div><b>1</b><span>Device per table</span></div>
      </div>
    </header>

    <section class="stack">
      <div class="section-label"><h3>How to play</h3><span class="eyebrow">6 steps</span></div>
      <ol class="steps">
        <li><div><b>Select your table's role</b><span>Each table leads a different organisation: McKinsey, a client bank, Accenture or an AI startup. Your briefing explains your position, who you answer to, what you control and what is at stake.</span></div></li>
        <li><div><b>Make five decisions</b><span>Each decision is based on one section of our presentation. Discuss the situation as a table and agree on one of four options. There is no single correct answer, and every option has trade-offs.</span></div></li>
        <li><div><b>Review the consequences</b><span>After each decision you will see what happened, how it affects your position, who else is affected, and how your three scores change.</span></div></li>
        <li><div><b>Receive your outcome</b><span>After the fifth decision, your scores determine your ending. You will see a summary of every choice and what your outcome means for McKinsey.</span></div></li>
        <li><div><b>Be ready to explain your decisions</b><span>For each decision, agree as a table on why you chose it. In the debrief you will be asked to explain your reasoning and the outcome it led to.</span></div></li>
        <li><div><b>Share your outcome in the debrief</b><span>The presenter will ask each table for its ending and the decision it found hardest to agree on.</span></div></li>
      </ol>
    </section>

    <section class="stack">
      <div class="section-label"><h3>Your scores</h3></div>
      <p class="note">Each role tracks three scores from 0 to 100. Everyone starts at 50. Each choice raises or lowers them, and your final scores decide your ending. Aim for a balance: a very low score in any area can decide your outcome on its own.</p>
    </section>

    <section class="stack">
      <div class="section-label"><h3>How the decisions follow our presentation</h3></div>
      <div class="map">${map}</div>
      <p class="note">Your ending connects to Section 6, where we present our group's recommendation.</p>
    </section>

    <section class="stack">
      <div class="section-label"><h3>Choose your table's role</h3><span class="eyebrow">4 roles</span></div>
      <div class="roles">${cards}</div>
    </section>
    <footer class="disclaimer"><span class="eyebrow">Disclaimer</span><p>A class activity based on Mike W. Peng's case "The Consulting Industry". Scenario figures are illustrative. Not affiliated with McKinsey, Accenture or any firm named.</p></footer>
  `);
  app.querySelectorAll("[data-role]").forEach(b => b.onclick = () => brief(b.dataset.role));
}

function brief(id){
  const r = ROLES[id];
  S = {id, r, step:0, m:Object.fromEntries(Object.keys(r.metrics).map(k=>[k,50])), picks:[], flags:{}};
  view(`
    <div style="--rc:${r.color};display:flex;flex-direction:column;gap:18px">
      <span class="eyebrow">Table ${r.table} · Your briefing</span>
      <div class="stamp">
        <span class="badge">Your position</span>
        <h2>${r.title}</h2>
        <p style="font-size:1.05rem">You lead <b>${r.org}</b>. ${r.situation}</p>
      </div>
      <dl class="seat" style="margin:0">
        <div><dt>Your goal</dt><dd>${r.goal}</dd></div>
        <div><dt>You answer to</dt><dd>${r.answer}</dd></div>
        <div><dt>You control</dt><dd>${r.control}</dd></div>
        <div><dt>What is at stake</dt><dd>${r.stake}</dd></div>
      </dl>
      <div class="bar">
        <span class="eyebrow">Your starting scores</span>
        ${meters(r, S.m)}
      </div>
      <div class="btns">
        <button class="btn" id="go">Begin decision 1</button>
        <button class="btn ghost" id="back">Choose a different role</button>
      </div>
    </div>`);
  document.getElementById("go").onclick = decision;
  document.getElementById("back").onclick = home;
}

function meters(r, m){
  return `<div class="meters">${Object.entries(r.metrics).map(([k,lab]) =>
    `<div class="meter"><span class="lab">${lab}</span><span class="track"><span class="fill" style="width:${m[k]}%"></span></span><span class="val">${m[k]}</span></div>`).join("")}</div>`;
}
function header(){
  const r = S.r, n = r.decisions.length;
  const segs = Array.from({length:n},(_,i)=>`<span class="${i<=S.step?'on':''}"></span>`).join("");
  return `<div class="bar">
      <div class="bar-top">
        <span class="chip"><i></i>${r.title} · ${r.name}</span>
        <span style="display:flex;align-items:center;gap:10px"><span class="eyebrow">Decision ${S.step+1} of ${n}</span><span class="prog">${segs}</span></span>
      </div>
      ${meters(r, S.m)}
    </div>`;
}

function decision(){
  const r = S.r, d = r.decisions[S.step];
  const opts = d.options.map((o,i)=>`
    <button class="opt" data-i="${i}">
      <span class="k">${LETTERS[i]}</span>
      <span><span class="ol">${o.l}</span><span class="os">${o.s}</span></span>
    </button>`).join("");
  view(`<div style="--rc:${r.color};display:flex;flex-direction:column;gap:20px">
      ${header()}
      <div class="prompt">
        ${secTag(d.sec)}
        <h3>${d.area}</h3>
        <p>${d.prompt}</p>
        <p class="yourcall"><b>Your call as ${r.title}:</b> ${d.call}</p>
      </div>
      <div class="opts">${opts}</div>
      <p class="eyebrow" style="text-align:center">Agree as a table, then select one option</p>
    </div>`);
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => choose(+b.dataset.i));
}

function standing(r, net){
  if(net >= 10) return {c:"up", t:`Your standing as ${r.title} is stronger. ${cap(r.judge)} back this decision.`};
  if(net <= -10) return {c:"down", t:`Pressure on you as ${r.title} is rising. ${cap(r.judge)} are questioning this decision.`};
  return {c:"flat", t:`Your position as ${r.title} is steady, but ${r.judge} are watching closely.`};
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function choose(i){
  const r = S.r, d = r.decisions[S.step], o = d.options[i];
  const before = {...S.m};
  for(const k in o.e) S.m[k] = clamp(S.m[k] + o.e[k]);
  if(o.flag) S.flags[o.flag] = true;
  S.picks.push({d, o, i});
  let net = 0;
  const chips = Object.entries(r.metrics).map(([k,lab])=>{
    const v = S.m[k]-before[k]; net += v;
    const cls = v>0?"up":v<0?"down":"flat";
    return `<span class="delta ${cls}">${lab} ${v>0?"+":v<0?"−":"±"}${Math.abs(v)}</span>`;
  }).join("");
  const st = standing(r, net);
  const last = S.step === r.decisions.length-1;
  view(`<div style="--rc:${r.color};display:flex;flex-direction:column;gap:20px">
      ${header()}
      <div class="result">
        ${secTag(d.sec)}
        <div class="qbox"><span class="eyebrow">The question · ${d.area}</span><span>${d.prompt}</span></div>
        <p class="picked">As ${r.title}, you chose <b>${LETTERS[i]}. ${o.l}</b></p>
        <p class="what">${o.r}</p>
        <div class="impact">
          <div><span class="eyebrow">Your position</span><span class="v standing ${st.c}">${st.t}</span></div>
          <div><span class="eyebrow">Who else is affected</span><span class="v">${o.who}</span></div>
          <div><span class="eyebrow">Score changes</span><span class="deltas">${chips}</span></div>
        </div>
        <div class="lesson"><span class="eyebrow">Link to our presentation</span><span>${o.lesson}</span></div>
      </div>
      <button class="btn" id="next">${last ? "See your outcome" : "Continue to decision " + (S.step+2)}</button>
    </div>`);
  document.getElementById("next").onclick = () => { if(last) ending(); else { S.step++; decision(); } };
}

function ending(){
  const r = S.r, key = r.ending(S.m, S.flags), e = r.endings[key];
  const recap = S.picks.map(p=>`
    <div class="row">
      <span class="eyebrow">Decision ${p.d.sec} · ${SECTIONS[p.d.sec]}</span>
      <span class="q"><b>${p.d.area}.</b> ${p.d.prompt}</span>
      <span class="ch"><span class="lbl">You chose</span>${LETTERS[p.i]}. ${p.o.l}</span>
      <span class="ls"><span class="lbl">Outcome</span>${p.o.r}</span>
      <span class="ls"><span class="lbl">Link to our presentation</span>${p.o.lesson}</span>
    </div>`).join("");
  view(`<div style="--rc:${r.color};display:flex;flex-direction:column;gap:20px">
      <span class="eyebrow">Table ${r.table} · ${r.title}, ${r.name} · Your outcome</span>
      <div class="stamp">
        <span class="badge">Outcome</span>
        <h2>${e.t}</h2>
        <p style="font-size:1.05rem">${e.s}</p>
      </div>
      <div class="bar"><span class="eyebrow">Final scores</span>${meters(r, S.m)}</div>
      <div class="meaning"><span class="eyebrow">Section 6 · What this means for McKinsey</span><p>${e.m}</p></div>
      <div class="debrief"><b>For the debrief</b><span>Be ready to share your outcome, explain why your table made its key decisions, and name the decision you found hardest to agree on.</span></div>
      <section class="stack">
        <h3>Your five decisions</h3>
        <div class="recap">${recap}</div>
      </section>
      <div class="btns">
        <button class="btn" id="again">Replay this role</button>
        <button class="btn ghost" id="other">Choose another role</button>
      </div>
    </div>`);
  document.getElementById("again").onclick = () => brief(S.id);
  document.getElementById("other").onclick = home;
}

home();
})();
</script>
</body>
</html>
